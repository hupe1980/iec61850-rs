[package]
name = "iec61850-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "IEC 61850 in Rust: GOOSE, Sampled Values, an MMS client and server over the full OSI station-bus stack, and SCL. Panic-free, sans-IO, no_std-capable."
repository = "https://github.com/hupe1980/iec61850-rs"
keywords = ["iec61850", "goose", "sampled-values", "mms", "substation"]
categories = ["network-programming", "embedded", "no-std"]
readme = "README.md"
# Git-ignored files are never packaged; of the tracked ones, the site, the fuzz harness, CI and
# the scripts are left out too.
exclude = ["fuzz/", "site/", ".github/", "scripts/"]

[lib]
name = "iec61850_rs"

[package.metadata.docs.rs]
# The interesting surface is spread across the features; document all of them, and pass
# `--cfg docsrs` so every gated item shows the feature it needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "goose", "sv", "mms", "scl", "pcap", "client", "server"]
# The crate is `no_std` + `alloc` everywhere; `alloc` is not optional. `std` adds the file- and
# socket-facing surface.
std = []
# Process-bus codecs, publisher scheduler and subscriber state machines (no_std + alloc).
goose = []
sv = []
# The OSI stack of IEC 61850-8-1 (TPKT, COTP, session, presentation, ACSE), the MMS PDUs and
# the sans-IO association state machine in both roles (no_std + alloc).
mms = []
# SCL loading into an IED model descriptor (needs std).
scl = ["std", "dep:roxmltree"]
# Reading and writing classic pcap files (needs std).
pcap = ["std"]
# A blocking MMS client over TCP: the association state machine plus a socket, no runtime.
client = ["std", "mms"]
# A blocking MMS server over TCP: the association in the server role, the IED model from SCL
# as the served namespace, and the ACSI services above it. No runtime.
server = ["std", "mms", "scl"]
# GOOSE and SV on a live interface: raw Ethernet through `rawether` (Linux AF_PACKET, macOS
# and FreeBSD BPF), with the IEC 61850 presets.
net = ["std", "dep:rawether"]
# The `ied` command-line tool.
cli = ["std", "pcap", "scl", "goose", "sv", "mms", "client", "server", "net"]

[dependencies]
roxmltree = { version = "0.21", optional = true }
rawether = { version = "0.1", path = "../rawether", optional = true }

[dev-dependencies]
proptest = "1.11"

[lints.rust]
# The library itself carries `#![forbid(unsafe_code)]` in `src/lib.rs`, which is the actual
# guarantee and cannot be opted out of. This is `deny` rather than `forbid` so that a test
# target can opt in deliberately and visibly: `tests/allocation.rs` installs a counting
# global allocator, which is the only way to turn "the steady state allocates nothing" into
# something a test can assert.
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"
# `docsrs` is set only by the docs.rs build (see [package.metadata.docs.rs]); declare it
# so the lint does not report the crate's own gate as a typo.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"

[[bin]]
name = "ied"
path = "src/bin/ied.rs"
required-features = ["cli"]

# Every test target states the features it needs, so `cargo test --features <subset>` builds
# only the ones that can build.
[[test]]
name = "concepts"
path = "tests/concepts.rs"

[[test]]
name = "allocation"
path = "tests/allocation.rs"
required-features = ["goose", "sv", "server"]

[[test]]
name = "simulation"
path = "tests/simulation.rs"
required-features = ["goose"]

[[test]]
name = "pcap_goose"
path = "tests/pcap_goose.rs"
required-features = ["goose", "pcap", "scl"]

[[test]]
name = "pcap_sv"
path = "tests/pcap_sv.rs"
required-features = ["sv", "pcap", "scl"]

[[test]]
name = "pcap_mms"
path = "tests/pcap_mms.rs"
required-features = ["client"]

[[test]]
name = "scl_fixtures"
path = "tests/scl_fixtures.rs"
required-features = ["scl", "goose", "sv"]

[[test]]
name = "tshark_oracle"
path = "tests/tshark_oracle.rs"
required-features = ["goose", "sv", "pcap"]

[[test]]
name = "tshark_mms"
path = "tests/tshark_mms.rs"
required-features = ["client", "server"]

[[test]]
name = "regressions"
path = "tests/regressions.rs"
required-features = ["mms"]

# Interop against libiec61850 in both roles. Skips unless `IEC61850_LIBIEC61850` names a built
# checkout; nothing from it is vendored.
[[test]]
name = "interop"
path = "tests/interop.rs"
required-features = ["client", "server"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[test]]
name = "mms_client"
path = "tests/mms_client.rs"
required-features = ["client", "scl"]

[[test]]
name = "mms_server"
path = "tests/mms_server.rs"
required-features = ["client", "server"]

[[test]]
name = "net_link"
path = "tests/net_link.rs"
required-features = ["net", "goose", "sv"]

[[test]]
name = "process_bus_server"
path = "tests/process_bus_server.rs"
required-features = ["client", "server", "goose", "sv", "pcap"]

# Examples state the features they use, so `cargo test --no-default-features` does not try to
# build a GOOSE example without the GOOSE codec.
[[example]]
name = "goose_roundtrip"
# Every example is a `std` binary — `Error` only implements `std::error::Error` there.
required-features = ["std", "goose"]

[[example]]
name = "sv_merging_unit"
required-features = ["sv", "pcap"]

[[example]]
name = "mms_loopback"
required-features = ["client"]

[[example]]
name = "scl_model"
# It prints an engineered control model (`mms`) and the sampled-value channel layout (`sv`),
# both of which are gated fields on the SCL types themselves.
required-features = ["scl", "sv", "mms"]

[[example]]
name = "server_from_scl"
required-features = ["client", "server"]

[[example]]
name = "supervised_subscriber"
# The seam between the two buses: a GOOSE subscriber's state published into the `LGOS` the
# SCL file declares, and read back over MMS.
required-features = ["client", "server", "goose"]
