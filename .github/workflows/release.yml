name: Release

# Push an annotated tag to cut a release:
#
#   git tag -a v0.1.0 -m 'v0.1.0' && git push origin v0.1.0
#
# `workflow_dispatch` runs everything except the two irreversible steps, so the whole
# pipeline can be rehearsed on a branch before a tag exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled: a half-finished publish is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can say "no" cheaply, before six machines start building.
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # rawether, the raw Ethernet crate behind the `net` feature, is a path dependency at
      # ../rawether; cargo resolves it even when the feature is off.
      - run: git clone --depth 1 https://github.com/hupe1980/rawether "$GITHUB_WORKSPACE/../rawether"
      - uses: dtolnay/rust-toolchain@stable

      # A crates.io version is immutable and a tag is not, so the tag is checked against the
      # manifest rather than the other way round. Publishing 0.1.0 as v0.2.0 cannot be undone.
      - name: The tag and Cargo.toml must agree
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag does not match Cargo.toml version $version (expected v$version)"
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      # The packaged crate is not the working tree: `exclude` drops the site, the internal
      # notes, the fuzz harness and the downloaded standards material, and a crate that only
      # builds because of a file it does not ship fails here rather than on crates.io.
      - name: The published package builds from what it ships
        run: cargo publish --dry-run --locked

      - name: Show what would be published
        run: cargo package --list

  # The release gate is CI itself — the feature matrix, the 512-seed simulation, the examples
  # and the docs — invoked rather than copied.
  ci:
    name: ci
    needs: guard
    uses: ./.github/workflows/ci.yml

  # `ied` is the reason to want a binary at all: a laptop on a substation LAN, or a gateway
  # with no Rust toolchain on it. Every target builds natively, which the crate can afford
  # because it has no C dependencies and one optional Rust one.
  binaries:
    name: ied ${{ matrix.target }}
    needs: [guard, ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          # Statically linked: one file to copy onto a device whose glibc is older than the
          # runner's, which is most of them.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, packages: musl-tools }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, packages: musl-tools }
          # Apple Silicon only: macOS has not shipped on x86_64 for years, and the runner
          # that could build for it is gone.
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      # rawether, the raw Ethernet crate behind the `net` feature, is a path dependency at
      # ../rawether; cargo resolves it even when the feature is off.
      - run: git clone --depth 1 https://github.com/hupe1980/rawether "$GITHUB_WORKSPACE/../rawether"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      # `cli` is not a default feature — it is the only thing that builds this binary.
      - run: cargo build --release --locked --features cli --bin ied --target ${{ matrix.target }}

      # Every target is built on its own architecture, so the binary in the archive is also
      # the binary that answers `--help` here: an archive nobody ran is a guess.
      - name: Package
        shell: bash
        run: |
          name="ied-${{ needs.guard.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then bin=ied.exe; else bin=ied; fi
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/$bin"
          [ "$bin" = ied ] && strip "dist/$name/$bin" || true
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          "./dist/$name/$bin" --help > /dev/null
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ied-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The only step that cannot be taken back — a crates.io version is immutable — so nothing
  # runs it on a guess: the gate has passed, `cargo publish --dry-run` has succeeded, and
  # every binary has been built and has answered `--help`.
  crates-io:
    name: crates.io
    needs: [guard, ci, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # crates.io Trusted Publishing: the job exchanges its OIDC identity for a short-lived token,
    # so no registry secret is stored. The environment is where a required reviewer goes if a
    # publish should need a human to approve it.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # rawether, the raw Ethernet crate behind the `net` feature, is a path dependency at
      # ../rawether; cargo resolves it even when the feature is off.
      - run: git clone --depth 1 https://github.com/hupe1980/rawether "$GITHUB_WORKSPACE/../rawether"
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Last: the release page is the announcement, so it goes up once the thing it announces is
  # actually installable.
  github-release:
    name: github release
    needs: [guard, binaries, crates-io]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Whoever downloads a binary off a release page should be able to check it without
      # trusting the page it came from.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The changelog entry for this version is the release note; `--generate-notes`
          # appends the commit list under it. A version with no entry gets the commit list
          # alone rather than failing the release.
          awk -v v="${{ needs.guard.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "${{ needs.guard.outputs.tag }}" \
            --title "${{ needs.guard.outputs.tag }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            artifacts/*

  # The Homebrew formula follows the GitHub release it points at, for a release only (a `-` in
  # the version is a pre-release). Owner setup, once: a GitHub App installed on
  # hupe1980/homebrew-tap only, with contents read and write, and a GitHub environment
  # `release` (deployment rule: tags `v*`) holding its HOMEBREW_APP_ID and
  # HOMEBREW_APP_PRIVATE_KEY. Third-party actions here are pinned by commit: the job holds a
  # write token.
  tap:
    name: homebrew tap
    needs: [guard, github-release]
    if: github.event_name == 'push' && !contains(needs.guard.outputs.version, '-')
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sha256sums
          path: dist
      # A short-lived installation token that can write to the tap only.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hupe1980
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          repository: hupe1980/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
          persist-credentials: true
      - name: Update the formula
        run: |
          mkdir -p tap/Formula
          scripts/release/formula.sh "$VERSION" dist/SHA256SUMS > tap/Formula/ied.rb
          cd tap
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "iec61850-rs release"
            git config user.email "iec61850-rs-release@users.noreply.github.com"
            git add Formula/ied.rb
            git commit -m "ied $VERSION"
            git push
          fi

  # What a user gets from the tap installs and answers, on clean machines.
  smoke:
    name: brew install ${{ matrix.os }}
    needs: [guard, tap]
    if: github.event_name == 'push' && needs.tap.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        run: |
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: |
          brew install hupe1980/tap/ied
          brew test ied
          [ "$(ied --version)" = "ied ${{ needs.guard.outputs.version }}" ]
