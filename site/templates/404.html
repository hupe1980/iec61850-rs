{% extends "base.html" %}

{% block content %}
<div class="wrap" style="padding: 5rem 0 6rem; max-width: 40rem;">
  <span class="eyebrow">404</span>
  <h1 style="font-size: 2rem; letter-spacing: -.03em; margin: 0 0 .75rem;">Nothing here</h1>
  <p class="muted">That page does not exist, or it moved. The documentation index lists
  everything there is.</p>
  <div class="cta" style="margin-top: 1.5rem;">
    <a class="btn btn-primary" href="{{ get_url(path='@/docs/_index.md') | safe }}">Documentation</a>
    <a class="btn btn-ghost" href="{{ get_url(path='@/_index.md') | safe }}">Home</a>
  </div>
</div>
{% endblock %}
